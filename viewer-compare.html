<!doctype html>
<html><head><meta charset="utf-8"><title>viewer compare (temporary)</title>
<link href="/js/pgnviewer/css/pgnvjs.css" rel="stylesheet">
<script src="/js/pgnviewer/js/pgnvjs.js"></script>
<script src="/js/pgnviewer-1.6.11/dist.js"></script>
<style>body{font-family:sans-serif;margin:10px}.row{display:flex;gap:16px;align-items:flex-start;border-top:2px solid #888;padding:8px 0}.col{width:560px}h4{margin:2px 0}</style>
</head><body>
<h3>Old pgnvjs (2017) left, new 1.6.11 right</h3>
<div id="rows"></div>
<script>
window.R = {};
var FILES = ["/assets/news/alan_game.pgn","/assets/news/nello_game.pgn","/assets/news/robin_simon.pgn","/assets/pgn/Black- Carlin-Oct-2017-v1.pgn","/assets/pgn/super_tuesday_barr.pgn","/assets/pgn/super_tuesday_jerome.pgn","/assets/pgn/super_tuesday_leake.pgn","/assets/pgn/super_tuesday_stone.pgn","https://lichess.org/api/study/Zwqt6BdF/TFFN2q5c.pgn"];
FILES.forEach(function (f, i) {
  var row = document.createElement("div"); row.className = "row";
  row.innerHTML = '<div class="col"><h4>old: ' + f + '</h4><div id="o' + i + '"></div></div><div class="col"><h4>new</h4><div id="n' + i + '"></div></div>';
  document.getElementById("rows").appendChild(row);
  var cfg = { position: "start", locale: "en", pieceStyle: "merida", orientation: i % 2 ? "black" : "white", theme: "chesscom", scrollable: true, movesHeight: "400px" };
  var res = R[f] = {};
  fetch(f).then(function (r) { return r.text(); }).then(function (text) {
    try { var c = Object.assign({ pgnFile: f }, cfg); if (f.indexOf("http") === 0) { c = Object.assign({ pgn: text }, cfg); } pgnView("o" + i, c); res.old = "ok"; } catch (e) { res.old = "ERR " + String(e).slice(0, 100); }
    try { PGNV.pgnView("n" + i, Object.assign({ pgn: text }, cfg)); res.new = "ok"; } catch (e) { res.new = "ERR " + String(e).slice(0, 100); }
    if (f.indexOf("http") === 0) { try { PGNV.pgnView("n" + i + "x", { pgn: text }); } catch (e) {} }
    var d2 = document.createElement("div"); d2.id = "pf" + i; row.appendChild(d2);
    try { PGNV.pgnView("pf" + i, Object.assign({ pgnFile: f }, cfg)); res.newPgnFile = "ok"; } catch (e) { res.newPgnFile = "ERR " + String(e).slice(0, 100); }
  });
});
</script></body></html>
