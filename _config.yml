name: "Streatham & Brixton Chess Club"
shortname: "S&BCC"
description: "We're a lively London chess club and welcome players of all ages and abilities. We play social chess in Streatham, and league matches in Central London, South London and Surrey."
url: "https://streathamchess.org"
author: "Streatham Chess Club"
exclude:
  - Gemfile
  - README.md
  - .notes
  - rakefile
markdown: kramdown
gems:
  - jekyll-sitemap
plugins:
  - jekyll-seo-tag
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: "admin"
    values:
      sitemap: false
  -
    scope:
      path: "assets/newsletter"
    values:
      sitemap: false
