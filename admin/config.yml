backend:
  name: github
  repo: streathamchess/streathamchess.github.io
  branch: master # Branch to update
  base_url: https://streatham-cms-auth.titorenko.workers.dev # OAuth proxy (Cloudflare Worker) for "Sign In with GitHub"

media_folder: "assets/image_uploads" # Where uploaded files are stored in the repo
public_folder: "/assets/image_uploads" # How posts refer to them (as existing posts do)

collections:
  - name: "blog" # Used in routes, e.g., /admin/#/collections/blog
    label: "Blog" # Used in the UI
    folder: "_posts" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "string", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "pages" # Site pages: fixed list, they can be edited but not added or deleted here
    label: "Pages"
    description: "Pages with HTML or Liquid tags ({% ... %}) open in the raw editor first, to keep them intact. Edit text there, or switch to the rich text editor only for plain-text pages."
    files:
      - name: "home"
        label: "Home page (Welcome)"
        file: "index.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Page heading, if different from the title (optional)", name: "heading", widget: "string", required: false}
          - {label: "Search title (shown in Google; optional)", name: "seo_title", widget: "string", required: false}
          - {label: "Search description (shown in Google; optional)", name: "description", widget: "string", required: false}
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Body", name: "body", widget: "markdown", modes: ["raw", "rich_text"]}
      - name: "about"
        label: "About us"
        file: "about/index.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Body", name: "body", widget: "markdown", modes: ["raw", "rich_text"]}
      - name: "venues"
        label: "Where we play"
        file: "about/venues.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Search title (shown in Google; optional)", name: "seo_title", widget: "string", required: false}
          - {label: "Description", name: "description", widget: "string", required: false}
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Body", name: "body", widget: "markdown", modes: ["raw", "rich_text"]}
      - name: "join"
        label: "How to join"
        file: "join.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Search title (shown in Google; optional)", name: "seo_title", widget: "string", required: false}
          - {label: "Search description (shown in Google; optional)", name: "description", widget: "string", required: false}
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
          - {label: "Body", name: "body", widget: "markdown", modes: ["raw", "rich_text"]}
      - name: "contact"
        label: "Club contacts"
        file: "contact.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Search title (shown in Google; optional)", name: "seo_title", widget: "string", required: false}
          - {label: "Search description (shown in Google; optional)", name: "description", widget: "string", required: false}
          - {label: "Layout", name: "layout", widget: "hidden", default: "default"}
